<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devil Predictor - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  background:#08040c;
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.bg-layer{
  position:fixed;inset:0;z-index:0;pointer-events:none;
}
.blob-1,.blob-2,.blob-3{
  position:absolute;border-radius:50%;filter:blur(120px);opacity:.18;
}
.blob-1{
  width:500px;height:500px;background:radial-gradient(circle,#ff3b5c 0%,transparent 70%);
  top:-10%;left:-8%;animation:blobDrift1 18s ease-in-out infinite;
}
.blob-2{
  width:420px;height:420px;background:radial-gradient(circle,#c41e42 0%,transparent 70%);
  bottom:-12%;right:-6%;animation:blobDrift2 22s ease-in-out infinite;
}
.blob-3{
  width:340px;height:340px;background:radial-gradient(circle,#8b5cf6 0%,transparent 70%);
  top:50%;left:50%;transform:translate(-50%,-50%);animation:blobDrift3 15s ease-in-out infinite;
}
@keyframes blobDrift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
@keyframes blobDrift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,-25px)}}
@keyframes blobDrift3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-45%,-55%) scale(1.12)}}

.grid-overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:60px 60px;
}

.particle{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  background:#ff3b5c;opacity:0;animation:particleFloat linear infinite;
}
@keyframes particleFloat{
  0%{opacity:0;transform:translateY(0) scale(0)}
  10%{opacity:.35;transform:translateY(-10vh) scale(1)}
  90%{opacity:.2}
  100%{opacity:0;transform:translateY(-100vh) scale(.4)}
}

.back-btn{
  position:fixed;top:24px;left:24px;z-index:100;
  width:48px;height:48px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all .25s ease;
}
.back-btn:hover{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,59,92,.2);
}
.back-btn:active{
  transform:scale(.9);
}
.back-btn svg{
  width:20px;height:20px;stroke:#6b7280;stroke-width:2;
  fill:none;stroke-linecap:round;stroke-linejoin:round;
}

.card{
  position:relative;z-index:10;
  max-width:380px;width:90%;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.06);
  border-radius:32px;
  padding:37px 28px;
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  animation:slideUp .8s ease-out;
}
@keyframes slideUp{
  0%{opacity:0;transform:translateY(40px)}
  100%{opacity:1;transform:translateY(0)}
}
.card::before{
  content:'';position:absolute;top:0;left:20%;right:20%;
  height:1px;
  background:linear-gradient(90deg,transparent,#ff3b5c,transparent);
  border-radius:1px;
}
/* rotating conic neon border */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.card::after{
  content:'';position:absolute;inset:-1px;border-radius:33px;padding:1px;
  background:conic-gradient(from var(--ang),transparent 55%,rgba(255,59,92,.9) 75%,rgba(139,92,246,.9) 90%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  animation:cardSpin 6s linear infinite;
  pointer-events:none;opacity:.9;
}
@keyframes cardSpin{to{--ang:360deg}}

.logo-box{
  width:77px;height:77px;margin:0 auto 20px;
  background:linear-gradient(135deg,rgba(255,59,92,.12),rgba(139,92,246,.12));
  border:1px solid rgba(255,59,92,.2);
  border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,59,92,.1)}
  50%{box-shadow:0 0 0 12px rgba(255,59,92,0)}
}
.logo-box svg{
  width:38px;height:38px;stroke:#ff3b5c;stroke-width:1.5;
  fill:none;stroke-linecap:round;stroke-linejoin:round;
}

.card-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:28px;font-weight:700;
  text-align:center;margin-bottom:6px;
  letter-spacing:-.5px;
}
.card-title span{
  background:linear-gradient(135deg,#ff3b5c,#ff2d78 55%,#8b5cf6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 14px rgba(255,59,92,.45));
}
.card-subtitle{
  text-align:center;font-size:12px;color:#6b7280;
  margin-bottom:32px;
}

.field-group{margin-bottom:20px}
.field-label{
  display:block;font-size:12px;color:#6b7280;
  text-transform:uppercase;letter-spacing:1px;
  margin-bottom:8px;
}
.input-wrap{position:relative}
.input-wrap input{
  width:100%;height:53px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;
  padding:0 48px 0 48px;
  color:#fff;font-family:'Inter',sans-serif;font-size:15px;
  outline:none;transition:all .25s ease;
}
.input-wrap input::placeholder{color:#4b5563}
.input-wrap input:focus{
  border-color:rgba(255,59,92,.55);
  box-shadow:0 0 0 4px rgba(255,59,92,.07),0 0 18px rgba(139,92,246,.14);
}
.input-icon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:#6b7280;stroke-width:1.5;
  fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;
}
.eye-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border:none;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.eye-btn:hover{background:rgba(255,255,255,.08)}
.eye-btn svg{width:16px;height:16px;stroke:#6b7280;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

.submit-btn{
  width:100%;height:53px;border:none;cursor:pointer;
  border-radius:16px;margin-top:8px;
  background:linear-gradient(135deg,#ff3b5c,#ff2d78 55%,#8b5cf6);
  background-size:200% 100%;
  color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .3s ease;position:relative;overflow:hidden;
}
.submit-btn::after{
  content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-20deg);animation:btnShine 3s ease-in-out infinite;
}
@keyframes btnShine{0%{left:-80%}55%,100%{left:130%}}
.submit-btn:hover{
  filter:brightness(1.1);
  box-shadow:0 8px 32px rgba(255,59,92,.35),0 0 20px rgba(139,92,246,.3);
  transform:translateY(-1px);
}
.submit-btn:active{transform:translateY(0) scale(.98)}
.submit-btn svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.submit-btn.loading .btn-text{display:none}
.submit-btn.loading .btn-arrow{display:none}
.submit-btn.loading .btn-spinner{display:flex}
.btn-spinner{
  display:none;align-items:center;justify-content:center;
  width:20px;height:20px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.info-row{
  display:flex;align-items:center;gap:8px;
  margin-top:20px;font-size:11px;color:#6b7280;
  justify-content:center;
}
.info-row svg{width:14px;height:14px;stroke:#6b7280;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

.toast-container{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;flex-direction:column;gap:10px;
  align-items:center;pointer-events:none;
}
.toast{
  background:rgba(15,23,42,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:14px 20px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:12px;
  animation:toastIn .4s ease-out forwards;
  pointer-events:auto;min-width:260px;
}
.toast.hiding{animation:toastOut .35s ease-in forwards}
@keyframes toastIn{0%{opacity:0;transform:translateY(20px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(20px) scale(.95)}}
.toast-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.toast.success .toast-dot{background:#ff3b5c;box-shadow:0 0 8px #ff3b5c}
.toast.error .toast-dot{background:#ef4444;box-shadow:0 0 8px #ef4444}
.toast.warning .toast-dot{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
.toast-body{display:flex;flex-direction:column;gap:2px}
.toast-title{font-size:13px;font-weight:600;color:#f1f5f9}
.toast-msg{font-size:11px;color:#64748b}

/* PARTICLES */
.ptcl{position:fixed;width:2px;height:2px;background:#ff3b5c;border-radius:50%;pointer-events:none;z-index:1;opacity:0}
@keyframes drift{0%{opacity:0;transform:translateY(100vh) scale(0)}10%{opacity:.6}90%{opacity:.6}100%{opacity:0;transform:translateY(-10vh) scale(1)}}

/* FADE UP */
.fd{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
.fd.vis{opacity:1;transform:translateY(0)}

@media(max-width:420px){
  .card{padding:32px 20px;border-radius:24px}
  .card-title{font-size:24px}
}
</style>
</head>
<body>

<div class="bg-layer">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="blob-3"></div>
</div>
<div class="grid-overlay"></div>
<div id="particles"></div>

<button class="back-btn" onclick="window.location.href='welcome.html'" aria-label="Go back">
  <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>

<div class="card fd">
  <div class="logo-box">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>

  <h1 class="card-title">VERIFY <span>ACCESS</span></h1>
  <p class="card-subtitle">Premium Server Login</p>

  <div class="field-group">
    <label class="field-label" for="keyInput">Access Key</label>
    <div class="input-wrap">
      <svg class="input-icon" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      <input type="password" id="keyInput" placeholder="Enter your access key" autocomplete="off" spellcheck="false">
      <button class="eye-btn" id="eyeBtn" type="button" aria-label="Toggle visibility">
        <svg id="eyeOff" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <svg id="eyeOn" viewBox="0 0 24 24" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="handleLogin()">
    <span class="btn-text">VALIDATE KEY</span>
    <svg class="btn-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    <div class="btn-spinner"></div>
  </button>

  <div class="info-row">
    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>Firebase Encrypted Verification</span>
  </div>
  <div class="info-row" style="margin-top:6px">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Expiry Detection Enabled</span>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgUHPXpBvpi0cEF2vQ2z8J-c8jI1cj1ko",
  databaseURL: "https://admin-pannel-de3f4-default-rtdb.firebaseio.com",
  projectId: "admin-pannel-de3f4",
  storageBucket: "admin-pannel-de3f4.firebasestorage.app",
  messagingSenderId: "318138798074",
  appId: "1:318138798074:web:0252256f3ddc783d815e43"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const keyInput = document.getElementById('keyInput');
const eyeBtn = document.getElementById('eyeBtn');
const eyeOff = document.getElementById('eyeOff');
const eyeOn = document.getElementById('eyeOn');
const submitBtn = document.getElementById('submitBtn');
const toastContainer = document.getElementById('toastContainer');

eyeBtn.addEventListener('click', () => {
  const isPass = keyInput.type === 'password';
  keyInput.type = isPass ? 'text' : 'password';
  eyeOff.style.display = isPass ? 'none' : 'block';
  eyeOn.style.display = isPass ? 'block' : 'none';
});

function showToast(type, title, msg) {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <div class="toast-dot"></div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      <div class="toast-msg">${msg}</div>
    </div>`;
  toastContainer.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('hiding');
    setTimeout(() => toast.remove(), 350);
  }, 3500);
}

window.handleLogin = async function() {
  const key = keyInput.value.trim();
  if (!key) {
    showToast('warning', 'Warning', 'Please enter your access key');
    return;
  }

  submitBtn.classList.add('loading');
  submitBtn.disabled = true;

  try {
    const keyRef = ref(db, 'keys/' + key);
    const snapshot = await get(keyRef);

    if (!snapshot.exists()) {
      showToast('error', 'Access Denied', 'Invalid access key');
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
      return;
    }

    const data = snapshot.val();

    if (data.expiry && data.expiry > Date.now()) {
      localStorage.setItem('premium/accessKey', key);
      showToast('success', 'Access Granted', 'Redirecting to dashboard...');
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 800);
    } else {
      showToast('error', 'Key Expired', 'Your access key has expired');
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
    }
  } catch (error) {
    showToast('error', 'Connection Error', 'Failed to verify key');
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
  }
};

keyInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleLogin();
});
</script>

<script>
(function(){
  const c=document.getElementById('particles');
  for(let i=0;i<25;i++){
    const p=document.createElement('div');
    p.className='ptcl';
    const s=Math.random()*2.5+1;
    const d=Math.random()*16+10;
    const dl=Math.random()*18;
    const l=Math.random()*100;
    const dr=(Math.random()-.5)*100;
    p.style.cssText=`width:${s}px;height:${s}px;left:${l}%;animation:drift ${d}s ${dl}s linear infinite`;
    p.animate([
      {opacity:0,transform:`translateY(100vh) translateX(0) scale(0)`},
      {opacity:.6,offset:.15},{opacity:.6,offset:.85},
      {opacity:0,transform:`translateY(-10vh) translateX(${dr}px) scale(1)`}
    ],{duration:d*1000,delay:dl*1000,iterations:Infinity,easing:'linear'});
    c.appendChild(p);
  }
})();
(function(){
  const obs=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target)}});
  },{threshold:.15});
  document.querySelectorAll('.fd').forEach(el=>obs.observe(el));
})();
</script>
</body>
</html>
