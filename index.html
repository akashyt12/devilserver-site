<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devil Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --emerald: #ff3b5c;
  --emerald-light: #ff7a94;
  --emerald-dark: #c41e42;
  --violet: #8b5cf6;
  --pink: #ff2d78;
  --bg: #08040c;
  --card: rgba(255,255,255,.02);
  --border: rgba(255,255,255,.06);
  --text: #fff5f7;
  --muted: #8a5a68;
  --dim: #3d2530;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  position: relative;
}

/* ── Background Effects ─────────────────────────── */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* Radial gradient blobs */
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
}

.blob-1 {
  width: 600px;
  height: 600px;
  background: var(--emerald);
  top: -150px;
  left: -100px;
}

.blob-2 {
  width: 500px;
  height: 500px;
  background: var(--violet);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0.12;
}

.blob-3 {
  width: 550px;
  height: 550px;
  background: var(--pink);
  bottom: -180px;
  right: -80px;
  opacity: 0.12;
}

/* Grid pattern */
.grid-pattern {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,59,92,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,59,92,0.05) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* Particles container */
#particles {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.particle {
  position: absolute;
  bottom: -10px;
  border-radius: 50%;
  background: var(--emerald);
  opacity: 0;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(1);
    opacity: 0;
  }
  10% {
    opacity: 0.6;
  }
  90% {
    opacity: 0.3;
  }
  100% {
    transform: translateY(-110vh) scale(0.5);
    opacity: 0;
  }
}

/* ── Center Content ─────────────────────────────── */
.loader-wrap {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.loader-wrap.fade-out {
  opacity: 0;
  transform: scale(0.95);
  pointer-events: none;
}

/* Logo container */
.logo-area {
  position: relative;
  width: 96px;
  height: 96px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Spinning rings */
.ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid transparent;
}

.ring-1 {
  width: 120px;
  height: 120px;
  border-top-color: var(--emerald);
  border-right-color: var(--emerald);
  animation: spin 2s linear infinite;
}

.ring-2 {
  width: 140px;
  height: 140px;
  border-top-color: var(--emerald-light);
  animation: spin 3s linear infinite reverse;
}

.ring-3 {
  width: 160px;
  height: 160px;
  border-top-color: var(--emerald-dark);
  border-bottom-color: var(--emerald-dark);
  animation: spin 4s linear infinite;
}

/* Conic neon aura */
.ring-glow {
  position: absolute;
  width: 176px;
  height: 176px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 55%, var(--emerald) 75%, var(--violet) 92%, transparent 100%);
  filter: blur(14px);
  opacity: .55;
  animation: spin 5s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Logo box */
.logo-box {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--emerald), var(--pink) 55%, var(--violet));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 40px rgba(255,59,92,0.3),
    0 0 80px rgba(139,92,246,0.15),
    inset 0 1px 0 rgba(255,255,255,0.25);
  animation: floatLogo 3s ease-in-out infinite;
}

@keyframes floatLogo {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.logo-box svg {
  width: 32px;
  height: 32px;
  fill: none;
  stroke: white;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Title */
.title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  background: linear-gradient(90deg, #ffffff, #ff7a94, #8b5cf6, #ffffff);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleShimmer 6s linear infinite;
}
@keyframes titleShimmer {
  0% { background-position: 0% 0; }
  100% { background-position: 300% 0; }
}

/* Subtitle */
.subtitle {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-top: -16px;
}

/* Progress bar */
.progress-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.progress-track {
  width: 280px;
  height: 4px;
  background: rgba(255,255,255,.06);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.6);
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--emerald), var(--pink), var(--violet));
  background-size: 200% 100%;
  border-radius: 4px;
  transition: width 0.1s linear;
  position: relative;
  animation: barFlow 2s linear infinite;
  box-shadow: 0 0 12px rgba(255,59,92,.6), 0 0 24px rgba(139,92,246,.35);
}
@keyframes barFlow {
  0% { background-position: 0% 0; }
  100% { background-position: 200% 0; }
}

.progress-dot {
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 12px var(--emerald), 0 0 24px var(--violet);
}

/* Loading text */
.loading-text {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 2px;
}

.loading-text span {
  color: var(--emerald);
}

/* ── Footer ─────────────────────────────────────── */
.footer {
  position: fixed;
  bottom: 32px;
  left: 0;
  right: 0;
  text-align: center;
  z-index: 10;
}

.footer-text {
  display: inline-block;
  padding: 8px 24px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.07);
  background: rgba(255,255,255,.03);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,.4);
  letter-spacing: 6px;
  text-transform: uppercase;
}

/* ── Button Utility ─────────────────────────────── */
.btn {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  padding: 12px 32px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
  color: white;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all .3s cubic-bezier(.4,0,.2,1);
}

.btn:hover {
  box-shadow: 0 0 20px rgba(255,59,92,.3);
  transform: translateY(-1px);
}

.btn:active {
  transform: scale(0.96);
}

/* PARTICLES */
.ptcl{position:fixed;width:2px;height:2px;background:#ff3b5c;border-radius:50%;pointer-events:none;z-index:1;opacity:0}
@keyframes drift{0%{opacity:0;transform:translateY(100vh) scale(0)}10%{opacity:.6}90%{opacity:.6}100%{opacity:0;transform:translateY(-10vh) scale(1)}}
</style>
</head>
<body>

<!-- Background Layer -->
<div class="bg-layer">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="grid-pattern"></div>
</div>

<!-- Particles (generated by JS) -->
<div id="particles"></div>

<!-- Center Loader -->
<div class="loader-wrap" id="loader">
  <div class="logo-area">
    <div class="ring-glow"></div>
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="logo-box">
      <svg viewBox="0 0 24 24">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
  </div>

  <h1 class="title">DEVIL PREDICTOR</h1>
  <p class="subtitle">QUANTUM AI ENGINE v4.0</p>

  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill">
        <div class="progress-dot"></div>
      </div>
    </div>
    <p class="loading-text">[<span id="statusText">INITIALIZING</span>] <span id="percentText">0%</span></p>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <p class="footer-text">SECURE &bull; QUANTUM &bull; FAST</p>
</div>

<script>
// ── Create Particles ──
(function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'ptcl';
    const s = Math.random() * 2.5 + 1;
    const d = Math.random() * 16 + 10;
    const dl = Math.random() * 18;
    const l = Math.random() * 100;
    const dr = (Math.random() - .5) * 100;
    p.style.cssText = `width:${s}px;height:${s}px;left:${l}%;animation:drift ${d}s ${dl}s linear infinite`;
    p.animate([
      {opacity:0,transform:`translateY(100vh) translateX(0) scale(0)`},
      {opacity:.6,offset:.15},{opacity:.6,offset:.85},
      {opacity:0,transform:`translateY(-10vh) translateX(${dr}px) scale(1)`}
    ],{duration:d*1000,delay:dl*1000,iterations:Infinity,easing:'linear'});
    container.appendChild(p);
  }
})();

// ── Progress Animation ──
(function simulateLoading() {
  const fill = document.getElementById('progressFill');
  const percentEl = document.getElementById('percentText');
  const statusEl = document.getElementById('statusText');
  const loader = document.getElementById('loader');

  const statuses = [
    'INITIALIZING',
    'LOADING MODELS',
    'CALIBRATING',
    'SYNCING DATA',
    'COMPILING',
    'OPTIMIZING',
    'VERIFYING',
    'READY'
  ];

  let progress = 0;
  const duration = 4000;
  const start = performance.now();

  function tick(now) {
    const elapsed = now - start;
    progress = Math.min((elapsed / duration) * 100, 100);

    fill.style.width = progress + '%';
    percentEl.textContent = Math.floor(progress) + '%';

    // Update status text based on progress thresholds
    const idx = Math.min(Math.floor(progress / 12.5), statuses.length - 1);
    statusEl.textContent = statuses[idx];

    if (progress < 100) {
      requestAnimationFrame(tick);
    } else {
      // Done - fade out and redirect
      percentEl.textContent = '100%';
      statusEl.textContent = 'READY';

      setTimeout(function() {
        loader.classList.add('fade-out');
        setTimeout(function() {
          window.location.href = 'welcome.html';
        }, 600);
      }, 400);
    }
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
